name: Instalador del agente Windows

on:
  push:
    paths:
      - "agent/**"
      - ".github/workflows/build-agent-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      # Opcionales: si existen, el agente y el instalador salen firmados (ver README, sección Firma)
      CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
      CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: python -m pip install --upgrade pip pyinstaller psutil

      - name: Compilar th_agent.exe (Python incluido)
        run: |
          python agent/windows/make_version_info.py
          pyinstaller --noconfirm --clean --onedir --console --name th_agent --version-file version_info.txt agent/th_agent.py

      - name: Prueba del ejecutable
        run: |
          dist\th_agent\th_agent.exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Preparar certificado de firma
        if: env.CODESIGN_PFX_BASE64 != ''
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64.Trim()))

      - name: Firmar th_agent.exe
        if: env.CODESIGN_PFX_BASE64 != ''
        run: ./agent/windows/sign.ps1 -PfxPath "$env:RUNNER_TEMP\codesign.pfx" -Password $env:CODESIGN_PASSWORD -Files dist\th_agent\th_agent.exe

      - name: Autoprueba de la firma (sin certificado configurado)
        if: env.CODESIGN_PFX_BASE64 == ''
        run: |
          $c  = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=CI selftest" -CertStoreLocation Cert:\CurrentUser\My
          $pw = ConvertTo-SecureString "selftest" -AsPlainText -Force
          Export-PfxCertificate -Cert $c -FilePath "$env:RUNNER_TEMP\selftest.pfx" -Password $pw | Out-Null
          Copy-Item dist\th_agent\th_agent.exe "$env:RUNNER_TEMP\selftest.exe"
          ./agent/windows/sign.ps1 -PfxPath "$env:RUNNER_TEMP\selftest.pfx" -Password selftest -Files "$env:RUNNER_TEMP\selftest.exe"
          Write-Host "::warning::Instalador SIN firmar. Configura los secretos CODESIGN_PFX_BASE64 y CODESIGN_PASSWORD (README, seccion Firma)."

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Crear instalador
        run: |
          $env:AGENT_VERSION = (Select-String -Path agent/th_agent.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" agent\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Firmar instalador
        if: env.CODESIGN_PFX_BASE64 != ''
        run: ./agent/windows/sign.ps1 -PfxPath "$env:RUNNER_TEMP\codesign.pfx" -Password $env:CODESIGN_PASSWORD -Files dist\ThreatHuntingAgent-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ThreatHuntingAgent-Setup
          path: dist/ThreatHuntingAgent-Setup.exe
          if-no-files-found: error
